<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Belajar bahasa Jepang JLPT N5–N1: simulasi ujian, tata bahasa, kosakata, dan ulasan kesalahan.">
<meta name="theme-color" content="#141415">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script>
  // apply saved theme before paint to avoid flash
  try { const s = JSON.parse(localStorage.getItem('michi.v1') || '{}').settings || {};
        document.documentElement.dataset.theme = s.themeChosen && s.theme ? s.theme : 'dark';
        if (s.lang) document.documentElement.lang = s.lang; } catch (e) {}
</script>
</head>

<a class="skip" href="#main" data-i18n="skip">Lewati ke konten</a>

      <span class="brand-mark" aria-hidden="true">道</span>
      <span class="brand-text">Michi</span>
      <span class="brand-level" id="brand-level"></span>
    </a>
    <p class="nav-label" id="nav-label"></p>
    <div id="level-pick" class="level-pick"></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Navigasi"></nav>
